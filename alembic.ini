# Development only: used to draft new migrations against a scratch database.
# Keep this file ASCII-only: Alembic reads it with the locale encoding (cp1252 on some Windows setups).
#   uv run alembic -x url=sqlite:///<tmp>/draft.db upgrade head
#   uv run alembic -x url=sqlite:///<tmp>/draft.db revision --autogenerate -m "message"
# At runtime the app applies migrations via rcompass.db.upgrade_to_head without this file.
[alembic]
script_location = src/rcompass/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///draft.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

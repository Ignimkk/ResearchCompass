[project]
name = "rcompass"
version = "0.0.1"
description = "로컬에서 혼자 연구하는 사람을 위한 연구 질문·실험·판정 기록 웹앱"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "platformdirs>=4.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.scripts]
rcompass = "rcompass.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
